repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  # Upstream's golang hook fails to build here and its docker hook runs an unpinned image,
  # so run the pinned upstream image directly.
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        language: docker_image
        entry: zricethezav/gitleaks:v8.30.1 git --pre-commit --redact --staged --verbose
        pass_filenames: false
