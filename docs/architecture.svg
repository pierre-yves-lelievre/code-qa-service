<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#64748b"/>
    </marker>
    <marker id="arrI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>

  <!-- Clients -->
  <text x="40" y="52" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5">CLIENTS</text>
  <g>
    <rect x="40" y="70" width="180" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="56" y="94" font-size="14" font-weight="600" fill="#0f172a">React page</text>
    <text x="56" y="113" font-size="12" fill="#64748b">search · index · chat · trace</text>
    <rect x="40" y="140" width="180" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="56" y="164" font-size="14" font-weight="600" fill="#0f172a">Claude Code / Cursor</text>
    <text x="56" y="183" font-size="12" fill="#64748b">via the MCP server</text>
    <rect x="40" y="210" width="180" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="56" y="234" font-size="14" font-weight="600" fill="#0f172a">curl / any HTTP client</text>
    <text x="56" y="253" font-size="12" fill="#64748b">OpenAPI at /docs</text>
  </g>

  <!-- FastAPI -->
  <rect x="290" y="70" width="200" height="196" rx="12" fill="#0f172a"/>
  <text x="308" y="98" font-size="15" font-weight="700" fill="#ffffff">FastAPI</text>
  <text x="308" y="116" font-size="12" fill="#94a3b8">app/api.py</text>
  <g font-size="10.5" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="308" y="146">GET  /health</text>
    <text x="308" y="164">GET  /repos/search</text>
    <text x="308" y="182">POST /index</text>
    <text x="308" y="200">GET  /index/{job_id}</text>
    <text x="308" y="218">GET  /repos, /repos/{id}</text>
    <text x="308" y="236">POST /ask</text>
    <text x="308" y="254">POST /queries/{id}/feedback</text>
  </g>
  <line x1="220" y1="98" x2="288" y2="98" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="220" y1="168" x2="288" y2="168" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="220" y1="238" x2="288" y2="238" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- INGEST lane -->
  <rect x="540" y="40" width="620" height="230" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="560" y="66" font-size="12" font-weight="700" fill="#4f46e5" letter-spacing="1.5">INGEST · background job, one snapshot per run</text>
  <g font-size="13" font-weight="600" fill="#0f172a">
    <rect x="560" y="84" width="130" height="58" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="574" y="107">GitHub API</text>
    <text x="574" y="126" font-size="11" font-weight="400" fill="#64748b">exists? size? branch</text>
    <rect x="712" y="84" width="130" height="58" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="726" y="107">git clone</text>
    <text x="726" y="126" font-size="11" font-weight="400" fill="#64748b">depth 1 · record sha</text>
    <rect x="864" y="84" width="130" height="58" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="878" y="107">tree-sitter</text>
    <text x="878" y="126" font-size="11" font-weight="400" fill="#64748b">py · ts · tsx · js</text>
    <rect x="1016" y="84" width="124" height="58" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="1030" y="107">chunk</text>
    <text x="1030" y="126" font-size="11" font-weight="400" fill="#64748b">symbols · windows</text>

    <rect x="560" y="176" width="130" height="58" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="574" y="199">activate</text>
    <text x="574" y="218" font-size="11" font-weight="400" fill="#64748b">atomic swap · sweep</text>
    <rect x="712" y="176" width="130" height="58" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="726" y="199">summary</text>
    <text x="726" y="218" font-size="11" font-weight="400" fill="#64748b">Claude · best effort</text>
    <rect x="864" y="176" width="130" height="58" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="878" y="199">Voyage code-4</text>
    <text x="878" y="218" font-size="11" font-weight="400" fill="#64748b">only new hashes</text>
    <rect x="1016" y="176" width="124" height="58" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="1030" y="199">content hash</text>
    <text x="1030" y="218" font-size="11" font-weight="400" fill="#64748b">key for vectors</text>
  </g>
  <g stroke="#4f46e5" stroke-width="1.5" fill="none" marker-end="url(#arrI)">
    <line x1="690" y1="113" x2="710" y2="113"/>
    <line x1="842" y1="113" x2="862" y2="113"/>
    <line x1="994" y1="113" x2="1014" y2="113"/>
    <path d="M1078 142 L1078 158 L1078 174"/>
    <line x1="1016" y1="205" x2="996" y2="205"/>
    <line x1="864" y1="205" x2="844" y2="205"/>
    <line x1="712" y1="205" x2="692" y2="205"/>
  </g>
  <path d="M490 182 L515 182 L515 113 L538 113" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="503" y="180" font-size="11" fill="#64748b" transform="rotate(-90 503 180)">POST /index → 202</text>

  <!-- ASK lane -->
  <rect x="540" y="300" width="620" height="230" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="560" y="326" font-size="12" font-weight="700" fill="#4f46e5" letter-spacing="1.5">ASK · one request, two model calls, no agent loop</text>
  <g font-size="13" font-weight="600" fill="#0f172a">
    <rect x="560" y="344" width="130" height="58" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="574" y="367">planner</text>
    <text x="574" y="386" font-size="11" font-weight="400" fill="#64748b">Claude · JSON · 6 s</text>

    <rect x="712" y="344" width="130" height="58" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="726" y="367">symbol ladder</text>
    <text x="726" y="386" font-size="11" font-weight="400" fill="#64748b">exact → contains</text>
    <rect x="712" y="412" width="130" height="50" rx="10" fill="#fffbeb" stroke="#fde68a"/>
    <text x="726" y="435">full-text</text>
    <text x="726" y="452" font-size="11" font-weight="400" fill="#64748b">tsvector, weighted</text>
    <rect x="712" y="470" width="130" height="50" rx="10" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="726" y="493">vector</text>
    <text x="726" y="510" font-size="11" font-weight="400" fill="#64748b">HNSW cosine</text>

    <rect x="864" y="344" width="130" height="58" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="878" y="367">fuse</text>
    <text x="878" y="386" font-size="11" font-weight="400" fill="#64748b">RRF · floor</text>
    <rect x="864" y="412" width="130" height="58" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="878" y="435">briefing</text>
    <text x="878" y="454" font-size="11" font-weight="400" fill="#64748b">12 hits + index</text>

    <rect x="1016" y="344" width="124" height="58" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="1030" y="367">Claude answer</text>
    <text x="1030" y="386" font-size="11" font-weight="400" fill="#64748b">native citations</text>
    <rect x="1016" y="412" width="124" height="58" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="1030" y="435">check</text>
    <text x="1030" y="454" font-size="11" font-weight="400" fill="#64748b">citations validated</text>
    <rect x="1016" y="480" width="124" height="40" rx="10" fill="#0f172a"/>
    <text x="1030" y="505" fill="#ffffff">answer + trace</text>
  </g>
  <g stroke="#4f46e5" stroke-width="1.5" fill="none" marker-end="url(#arrI)">
    <line x1="690" y1="373" x2="710" y2="373"/>
    <path d="M700 373 L700 437 L710 437"/>
    <path d="M700 437 L700 495 L710 495"/>
    <line x1="842" y1="373" x2="862" y2="373"/>
    <path d="M842 437 L852 437 L852 373"/>
    <path d="M842 495 L852 495 L852 373"/>
    <path d="M929 402 L929 410"/>
    <line x1="994" y1="441" x2="1014" y2="441"/>
    <path d="M1078 402 L1078 410"/>
    <path d="M1078 470 L1078 478"/>
  </g>
  <path d="M490 236 L512 236 L512 373 L558 373" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="503" y="330" font-size="11" fill="#64748b" transform="rotate(-90 503 330)">POST /ask</text>
  <path d="M1078 520 L1078 552 L528 552 L528 252 L493 252" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- Storage -->
  <rect x="290" y="580" width="870" height="130" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="310" y="606" font-size="12" font-weight="700" fill="#4f46e5" letter-spacing="1.5">POSTGRES + PGVECTOR · one database, one connection string to production</text>
  <g font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0f172a">
    <rect x="310" y="622" width="110" height="34" rx="8" fill="#f1f5f9"/><text x="326" y="644">repos</text>
    <rect x="430" y="622" width="110" height="34" rx="8" fill="#f1f5f9"/><text x="446" y="644">snapshots</text>
    <rect x="550" y="622" width="110" height="34" rx="8" fill="#f1f5f9"/><text x="566" y="644">files</text>
    <rect x="670" y="622" width="110" height="34" rx="8" fill="#f1f5f9"/><text x="686" y="644">chunks</text>
    <rect x="790" y="622" width="120" height="34" rx="8" fill="#f1f5f9"/><text x="806" y="644">embeddings</text>
    <rect x="920" y="622" width="110" height="34" rx="8" fill="#f1f5f9"/><text x="936" y="644">index_jobs</text>
    <rect x="1040" y="622" width="100" height="34" rx="8" fill="#f1f5f9"/><text x="1056" y="644">queries</text>
  </g>
  <text x="310" y="686" font-size="11" fill="#64748b">chunks: weighted tsvector, GIN · embeddings: vector(1024), HNSW, keyed (content_hash, model) · snapshots: partial unique on the active one</text>
  <g stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="2 3">
    <path d="M1150 270 L1150 290"/>
    <path d="M1150 530 L1150 578"/>
  </g>
  <text x="1168" y="286" font-size="10" fill="#94a3b8" transform="rotate(90 1168 286)">reads and writes</text>

  <!-- Footer -->
  <text x="40" y="740" font-size="11" fill="#94a3b8">PROVIDERS=fake swaps Voyage and Claude for deterministic fakes; everything else is identical.  Each retrieval leg fails independently.  Every answer is logged to queries with its trace.</text>
</svg>
