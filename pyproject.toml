[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-qa-service"
version = "0.1.0"
description = "Code Q&A over a public GitHub repository"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.0",
    "httpx>=0.27.0",
    "anthropic>=0.40.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack>=0.6.0",
]

[project.scripts]
serve = "app.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "pre-commit>=4.0.0",
    "pip-audit>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
